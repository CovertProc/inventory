<style>
  :root {
    --brand-red: #a51e1e;
    --brand-red-dark: #861818;
    --brand-red-soft: #f5e3e3;
    --ink: #2d2d2d;
    --ink-soft: #6b6b6b;
    --ink-faint: #9a9a9a;
    --bg: #f7f5f1;
    --paper: #ffffff;
    --line: #e5e1d8;
    --line-strong: #2d2d2d;
    --ok: #2d6a3e;
    --ok-soft: #e0ebd9;
    --warn: #b8860b;
    --warn-soft: #f5ecd2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  body { max-width: 1400px; margin: 0 auto; }

  /* Header with logo */
  header { padding: 28px 24px 24px; border-bottom: 3px solid var(--ink); display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; background: var(--paper); }
  .logo { height: 88px; width: auto; display: block; }
  .header-text { text-align: right; }
  .header-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(32px, 4.5vw, 52px); line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink); }
  .header-title .dot { color: var(--brand-red); }
  .header-address { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(14px, 1.4vw, 18px); text-transform: uppercase; letter-spacing: 0.12em; color: var(--brand-red); margin-top: 4px; font-weight: 600; }
  .header-sub { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--ink-soft); margin-top: 6px; font-weight: 500; }
  .header-sub strong { color: var(--ink); font-weight: 600; }

  main { padding: 32px 24px 80px; }

  /* Stats — bold builder/industrial feel */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; border: 2px solid var(--ink); margin-bottom: 32px; background: var(--paper); }
  .stat { padding: 20px 24px; border-right: 1px solid var(--line); position: relative; }
  .stat:last-child { border-right: none; }
  .stat-label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
  .stat-value { font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; color: var(--ink); }
  .stat-value .unit { font-size: 14px; color: var(--ink-soft); font-weight: 500; margin-left: 4px; letter-spacing: 0.05em; }
  .stat.alert { background: var(--brand-red); color: #fff; }
  .stat.alert .stat-label { color: rgba(255,255,255,0.85); }
  .stat.alert .stat-value { color: #fff; }

  .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; padding-top: 4px; }
  .search { flex: 1; min-width: 240px; position: relative; }
  .search input { width: 100%; padding: 12px 16px 12px 42px; border: 2px solid var(--ink); background: var(--paper); font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink); border-radius: 0; outline: none; transition: border-color 0.15s; }
  .search input:focus { border-color: var(--brand-red); }
  .search::before { content: ""; position: absolute; left: 16px; top: 50%; width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 50%; transform: translateY(-65%); }
  .search::after { content: ""; position: absolute; left: 27px; top: 50%; width: 7px; height: 2px; background: var(--ink); transform: translateY(8px) rotate(45deg); transform-origin: left; }
  .filter-btns { display: flex; gap: 0; border: 2px solid var(--ink); }
  .filter-btn { padding: 12px 18px; background: var(--paper); border: none; border-right: 1px solid var(--ink); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; cursor: pointer; color: var(--ink); transition: all 0.15s; }
  .filter-btn:last-child { border-right: none; }
  .filter-btn:hover { background: var(--bg); }
  .filter-btn.active { background: var(--ink); color: #fff; }

  .table-wrap { background: var(--paper); border: 2px solid var(--ink); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 700px; }
  thead { background: var(--ink); color: #fff; }
  th { padding: 14px 16px; text-align: left; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
  th[data-sort]::after { content: " \2195"; opacity: 0.35; font-weight: 400; }
  th:hover { background: #444; }
  th:hover::after { opacity: 0.7; }
  th.sorted { color: #ff8888; }
  th.sorted::after { content: " \2193"; opacity: 1; }
  th.sorted.asc::after { content: " \2191"; opacity: 1; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { border-bottom: 1px solid var(--line); transition: background 0.1s; }
  tbody tr:hover { background: var(--brand-red-soft); }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 14px 16px; vertical-align: middle; font-size: 13px; }
  td.code { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--ink); font-size: 12px; }
  td.name { font-weight: 500; color: var(--ink); }
  .badge { display: inline-block; padding: 4px 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; border-radius: 0; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.low { background: var(--warn-soft); color: var(--warn); }
  .badge.out { background: var(--brand-red); color: #fff; }

  .empty { padding: 60px 24px; text-align: center; color: var(--ink-soft); }
  .empty h2 { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; font-size: 28px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }

  footer { margin-top: 32px; padding: 24px; border-top: 2px solid var(--ink); font-size: 11px; color: var(--ink-soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; background: var(--paper); }
  footer code { background: var(--bg); padding: 2px 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink); }
  footer .brand-tag { font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600; color: var(--ink); }
  footer .brand-tag .dot { color: var(--brand-red); }

  @media (max-width: 700px) {
    header { grid-template-columns: 1fr; gap: 16px; text-align: center; padding: 20px 16px; }
    .logo { height: 64px; margin: 0 auto; }
    .header-text { text-align: center; }
    main { padding: 20px 16px 60px; }
    .stat { padding: 14px 16px; }
    .stat-value { font-size: 28px; }
    th, td { padding: 10px 12px; }
    td.name, td { font-size: 12px; }
  }
</style>
</head>

<main>

<div class="controls">
  <div class="search"><input type="text" id="search" placeholder="Search code, name, description..."></div>
  <div class="filter-btns">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="ok">In Stock</button>
    <button class="filter-btn" data-filter="out">Out</button>
  </div>
</div>

<div class="table-wrap">
  <table id="table">
    <thead>
      <tr>
        <th data-sort="code">Code</th>
        <th data-sort="name">Item</th>
        <th data-sort="qty" class="num">Qty</th>
        <th data-sort="status">Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

</main>

<footer>
  <div>Contact <strong>Jhun</strong> at WhatsApp for inquiries or immediate refresh of stocks update. <span id="itemCount"></span></div>
  <div class="brand-tag">Covert<span class="dot">.</span> Procurement &mdash; Builders Choice</div>
</footer>

<script>
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// DATA SOURCE
// ═══════════════════════════════════════════════════════════════════
// This page reads stock data from "stocks.csv" in the same folder.
// To update stocks: replace stocks.csv with your latest Xero export.

const CSV_FILE = "stocks.csv";

// State
let INVENTORY = [];
let LAST_UPDATED = "—";
let state = { filter: "all", search: "", sort: "code", asc: true };

// ═══════════════════════════════════════════════════════════════════
// CSV parser — handles quoted fields and commas inside quotes
// ═══════════════════════════════════════════════════════════════════
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i += 2; continue; }
      if (c === '"') { inQuotes = false; i++; continue; }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ""; i++; continue; }
    if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = ""; i++; continue;
    }
    field += c; i++;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length === 1 && r[0].trim() !== ""));
}

function rowsToInventory(rows) {
  if (rows.length < 2) return [];
  // Find column indexes (Xero export header has *ItemCode, ItemName, Quantity, etc.)
  const header = rows[0].map(h => h.replace(/^\*/, "").trim());
  const codeIdx = header.findIndex(h => h.toLowerCase() === "itemcode");
  const nameIdx = header.findIndex(h => h.toLowerCase() === "itemname");
  const qtyIdx  = header.findIndex(h => h.toLowerCase() === "quantity");
  const statusIdx = header.findIndex(h => h.toLowerCase() === "status");
  if (codeIdx === -1 || nameIdx === -1 || qtyIdx === -1) {
    throw new Error("CSV is missing required columns: ItemCode, ItemName, Quantity");
  }
  return rows.slice(1).map(r => {
    const qty = parseFloat((r[qtyIdx] || "0").replace(/,/g, "")) || 0;
    return {
      code: (r[codeIdx] || "").trim(),
      name: (r[nameIdx] || "").trim(),
      qty: Math.round(qty),
      active: statusIdx === -1 ? true : (r[statusIdx] || "").trim().toLowerCase() === "active",
    };
  }).filter(item => item.code && item.active);
}

// ═══════════════════════════════════════════════════════════════════
// App logic
// ═══════════════════════════════════════════════════════════════════

function status(item) {
  return item.qty <= 0 ? "out" : "ok";
}

function render() {
  const tbody = document.getElementById("tbody");
  const q = state.search.toLowerCase().trim();

  let items = INVENTORY.map(i => ({ ...i, status: status(i) }));

  if (state.filter !== "all") items = items.filter(i => i.status === state.filter);
  if (q) items = items.filter(i => (i.code + " " + i.name).toLowerCase().includes(q));

  items.sort((a, b) => {
    const av = a[state.sort], bv = b[state.sort];
    const cmp = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv));
    return state.asc ? cmp : -cmp;
  });

  if (items.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty"><h2>Nothing here</h2><div>No items match your filter or search.</div></div></td></tr>`;
  } else {
    tbody.innerHTML = items.map(i => `
      <tr>
        <td class="code">${escapeHtml(i.code)}</td>
        <td class="name">${escapeHtml(i.name)}</td>
        <td class="num">${i.qty.toLocaleString()}</td>
        <td><span class="badge ${i.status}">${i.status === "ok" ? "In stock" : "Out"}</span></td>
      </tr>
    `).join("");
  }

  document.getElementById("lastUpdated").textContent = LAST_UPDATED;
  document.getElementById("itemCount").textContent = INVENTORY.length > 0 ? `Showing ${items.length} of ${INVENTORY.length} items.` : "";

  document.querySelectorAll("th").forEach(th => {
    th.classList.remove("sorted", "asc");
    if (th.dataset.sort === state.sort) {
      th.classList.add("sorted");
      if (state.asc) th.classList.add("asc");
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function showError(msg) {
  document.getElementById("tbody").innerHTML = `<tr><td colspan="4"><div class="empty"><h2>Could not load stock data</h2><div>${escapeHtml(msg)}</div></div></td></tr>`;
}

// ═══════════════════════════════════════════════════════════════════
// Load the CSV on page open
// ═══════════════════════════════════════════════════════════════════
async function loadData() {
  try {
    // Add cache-buster so refreshes always get the latest CSV
    const res = await fetch(CSV_FILE + "?t=" + Date.now());
    if (!res.ok) throw new Error(`stocks.csv not found (HTTP ${res.status}). Upload the file to your repo.`);

    // Read last-modified header for "Last updated"
    const lastMod = res.headers.get("last-modified");
    if (lastMod) {
      const d = new Date(lastMod);
      LAST_UPDATED = d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" }) +
                     " · " + d.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit" });
    }

    const text = await res.text();
    const rows = parseCSV(text);
    INVENTORY = rowsToInventory(rows);
    render();
  } catch (err) {
    console.error(err);
    showError(err.message);
  }
}

// Wire up controls
document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; render(); });
document.querySelectorAll(".filter-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".filter-btn").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  state.filter = b.dataset.filter;
  render();
}));
document.querySelectorAll("th[data-sort]").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.sort;
  if (state.sort === k) state.asc = !state.asc;
  else { state.sort = k; state.asc = true; }
  render();
}));

loadData();
</script>
</body>
